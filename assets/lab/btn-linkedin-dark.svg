<svg xmlns="http://www.w3.org/2000/svg" width="177" height="72" viewBox="0 0 177 72" role="img" aria-label="LinkedIn">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e11d48"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
<linearGradient id="s" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect x="10" y="10" width="157" height="52" rx="26"/></clipPath>
<style>.sh{animation:sh 4.2s ease-in-out infinite}@keyframes sh{0%,55%{transform:translateX(-120px)}85%,100%{transform:translateX(217px)}}
.ring{animation:ring 4.2s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes ring{0%,60%{transform:scale(1);opacity:0}64%{opacity:.7}100%{transform:scale(1.12,1.3);opacity:0}}
.ic{animation:ic 4.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes ic{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-12deg) scale(1.15)}82%{transform:rotate(8deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
<rect class="ring" x="10" y="10" width="157" height="52" rx="26" fill="none" stroke="#e11d48" stroke-width="2"/>
<rect x="10" y="10" width="157" height="52" rx="26" fill="#15111c" stroke="#e11d48" stroke-opacity=".6"/>
<g clip-path="url(#c)"><rect class="sh" x="0" y="0" width="70" height="72" fill="url(#s)" transform="skewX(-20)"/></g>
<text class="ic" x="42" y="44" text-anchor="middle" font-size="21">in</text>
<text x="62" y="43" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#e11d48">LinkedIn</text>
</svg>
