<svg xmlns="http://www.w3.org/2000/svg" width="84" height="84" viewBox="0 0 84 84" role="img" aria-label="Sticker 💜">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d4ed8"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
<style>.b{animation:b 3.2s ease-in-out infinite;animation-delay:-2.4s;transform-box:fill-box;transform-origin:center}
@keyframes b{0%,70%,100%{transform:rotate(0) scale(1)}78%{transform:rotate(-14deg) scale(1.12)}86%{transform:rotate(10deg) scale(1.05)}}
.r{animation:r 3.2s ease-out infinite;animation-delay:-2.4s;transform-box:fill-box;transform-origin:center;opacity:0}
@keyframes r{0%,70%{transform:scale(1);opacity:0}74%{opacity:.7}100%{transform:scale(1.25);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}.zz,.heart{opacity:.8}}</style></defs>
<circle class="r" cx="42" cy="42" r="33" fill="none" stroke="#1d4ed8" stroke-width="2"/>
<circle cx="42" cy="42" r="33" fill="#ffffff" stroke="url(#g)" stroke-width="2.5"/>
<text class="b" x="42" y="54" text-anchor="middle" font-size="32">💜</text>
</svg>
