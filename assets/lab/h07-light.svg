<svg xmlns="http://www.w3.org/2000/svg" width="800" height="64" viewBox="0 0 800 64" role="img" aria-label="Lab 07: Leave a mark">
<defs><linearGradient id="h" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1d4ed8" stop-opacity="0"/><stop offset=".5" stop-color="#1d4ed8"/><stop offset="1" stop-color="#0e7490" stop-opacity="0"/></linearGradient>
<style>.scan{animation:scan 5s ease-in-out infinite}@keyframes scan{0%{transform:translateX(0)}100%{transform:translateX(390px)}}
@media (max-width:520px){.note{display:none}}
.blip{animation:blip 2.4s ease-in-out infinite}@keyframes blip{0%,100%{opacity:1}50%{opacity:.25}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}.zz,.heart{opacity:.8}}</style></defs>
<rect x="20" y="18" width="94" height="30" rx="8" fill="none" stroke="#1d4ed8" stroke-opacity=".55"/>
<circle class="blip" cx="34" cy="33" r="4" fill="#1d4ed8"/>
<text x="46" y="38.5" font-family="ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" font-weight="700" fill="#1d4ed8">LAB/07</text>
<text x="132" y="42" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" fill="#0e1726">Leave a mark</text>
<rect x="360" y="32.5" width="420" height="1" fill="#d5dfeb"/>
<rect class="scan" x="360" y="31.5" width="60" height="3" rx="1.5" fill="url(#h)"/>
<text class="note" x="780" y="22" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'Cascadia Mono',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" fill="#5b6b82">a sticker wall for visitors</text>
</svg>
