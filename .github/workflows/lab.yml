name: lab

# Redraws the contribution mountains of the profile README into the lab-output branch.
# The interactive parts (lamp, cat, tic-tac-toe, stickers) run on the adilkan.com server and need no workflow.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: lab
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Redraw the mountains
        run: node lab/run.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
