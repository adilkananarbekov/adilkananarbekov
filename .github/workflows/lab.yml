name: lab

# The profile's live room: redraws the pictures every hour and when a visitor presses a README button
# (an issue titled "lab: switch the lamp" or "lab: feed the cat"). Output goes to the lab-output branch.
# Each run applies every open "lab:" issue, so runs that GitHub drops from the concurrency queue lose nothing.
on:
  schedule:
    - cron: '17 * * * *'
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  lab:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, 'lab:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: lab
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Redraw the lab
        run: node lab/run.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
